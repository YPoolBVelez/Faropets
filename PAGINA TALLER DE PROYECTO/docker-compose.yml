services:
  app:
    build:
      context: ./Faropets
      dockerfile: Dockerfile
    working_dir: /src
    command: dotnet watch run --no-launch-profile --urls http://0.0.0.0:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Initial Catalog=Faropets;User ID=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "8080:8080"
    volumes:
      - ./Faropets:/src
      - faropets-obj:/src/obj
      - faropets-bin:/src/bin
    depends_on:
      sqlserver:
        condition: service_healthy
    init: true
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Crea un archivo .env a partir de .env.example y define SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - faropets-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  faropets-obj:
  faropets-bin:
  faropets-sql-data:
